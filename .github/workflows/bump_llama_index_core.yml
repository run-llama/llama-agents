name: Bump llama-index-core

on:
  repository_dispatch:
    types: [llama-index-core-release]
  workflow_dispatch:

jobs:
  bump-dependency:
    if: github.repository == 'run-llama/llama-agents'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - run: uv lock --upgrade-package llama-index-core

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: bump llama-index-core"
          branch: bump-llama-index-core
          delete-branch: true
          title: "chore: bump llama-index-core"
          labels: |
            dependencies
            automated
