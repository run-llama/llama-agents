name: Linting

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dev dependencies
        run: uv sync --all-extras --all-packages

      - name: Run pre-commit
        id: pre-commit
        continue-on-error: true
        run: uv run pre-commit run -a

      - name: Auto-fix PR if needed
        uses: ./.github/actions/pr-fix-comment
        with:
          app-id: ${{ secrets.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          add-paths: "."
          check-name: "Lint"
          fix-command: "uv run pre-commit run -a"

      - name: Fail if pre-commit failed
        if: steps.pre-commit.outcome == 'failure'
        run: exit 1
