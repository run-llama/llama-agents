name: Setup publish job
description: Install Python + uv and download the publish plan artifact. Assumes the repo is already checked out.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # Publish jobs (PyPI via OIDC, Docker, Helm) run cold: no cache another workflow could poison.
      with:
        enable-cache: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: publish-plan
